name: emulator-wasm

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release
  OUTPUT_DIR: build_wasm

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Setup Ninja
      uses: ashutoshvarma/setup-ninja@master
      with:
        # ninja version to download. Default: 1.10.0
        version: 1.10.0

    # pico9918-core generates its overlay image arrays at configure time.
    - name: Python for the overlay assets
      id: python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install pillow
      run: python -m pip install --upgrade pillow
          
    - name: Setup emscripten
      working-directory: ${{ github.workspace }}
      run: ./emconfig.bat ${{ env.OUTPUT_DIR }} -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}"
        
    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ env.OUTPUT_DIR }} --config ${{ env.BUILD_TYPE }}
 
    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: emulator-wasm-build
        path: ${{ env.OUTPUT_DIR }}/bin
